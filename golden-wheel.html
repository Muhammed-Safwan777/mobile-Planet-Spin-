<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120c02">
  <title>Golden Wheel — Spin &amp; Win</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-gold">
  <div class="bg" aria-hidden="true"><div class="bg-stars"></div><div class="bg-stars-2"></div></div>

  <div class="page">
    <div class="topbar">
      <a class="back-btn" href="index.html"><span aria-hidden="true">←</span> Back to Home</a>
      <span class="tag">Premium Rewards</span>
    </div>

    <h1 class="title">Golden Wheel</h1>
    <p class="subtitle">Spin the wheel of fortune and win something truly golden!</p>

    <main class="wheel-stage">
      <div class="wheel-wrap">
        <div class="pointer" id="pointer" aria-hidden="true">
          <svg viewBox="0 0 44 56"><path d="M22 54 L4 21 A19 19 0 1 1 40 21 Z"/><circle cx="22" cy="19" r="6"/></svg>
        </div>
        <canvas id="wheel" role="img" aria-label="Prize wheel: Smartwatch, Airpod, 500 Petrol, Powerbank, Better luck next time, Bluetooth Speaker"></canvas>
      </div>
      <button class="spin-btn" id="spinBtn" type="button">SPIN</button>
      <p class="hint">Tap SPIN and wait for the wheel to stop.</p>
    </main>
  </div>

  <!-- Result popup -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card">
      <div class="modal-badge"><canvas id="prizeIcon" width="84" height="84"></canvas></div>
      <h2 id="modalTitle"></h2>
      <p class="modal-prize" id="modalPrize"></p>
      <p class="modal-msg" id="modalMsg"></p>
      <button class="spin-btn" id="modalClose" type="button">OK</button>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="wheel.js"></script>
  <script>
    SpinWheel.init({
      segments: [
        { label: 'Smartwatch',            icon: 'watch',     win: true,  colors: ['#1d1404', '#4f3909'] },
        { label: 'Airpod',                icon: 'airpod',    win: true,  colors: ['#332406', '#70500f'] },
        { label: '500 Petrol',            icon: 'petrol',    win: true,  colors: ['#1d1404', '#4f3909'] },
        { label: 'Powerbank',             icon: 'powerbank', win: true,  colors: ['#332406', '#70500f'] },
        { label: 'Better luck next time', icon: 'sad',       win: false, colors: ['#0c0c0c', '#2d2924'] },
        { label: 'Bluetooth Speaker',     icon: 'speaker',   win: true,  colors: ['#332406', '#70500f'] }
      ],
      theme: {
        ring:       ['#fff3b0', '#d4af37', '#8a6a14', '#ffe27a', '#b8860b'],
        rim:        '#120c02',
        bulbOn:     '#fff6c2',
        bulbOff:    '#7a5a12',
        divider:    '#d4af37',
        hub:        ['#fff3b0', '#b8860b'],
        /* every product icon is filled with a gold gradient (#FFD700 core) */
        iconStyle: function (c) {
          var g = c.createLinearGradient(-50, -50, 50, 50);
          g.addColorStop(0,    '#fff3a3');
          g.addColorStop(0.45, '#ffd700');
          g.addColorStop(1,    '#b8860b');
          return g;
        },
        iconGlow:   'rgba(255,215,0,.55)',
        textColor:  '#ffe9a3',
        textStroke: 'rgba(24,15,2,.9)'
      },
      winTitle:  'Congratulations! 🏆',
      loseTitle: 'Almost golden! ✨',
      winMessage:  'You won this prize! Show this screen at the billing counter to claim it.',
      loseMessage: 'No prize this time, but fortune favours the persistent. Thank you for shopping with us!',
      confettiColors: ['#ffd700', '#fff3a3', '#ffbf00', '#b8860b', '#ffffff', '#f5deb3', '#ff9f1c']
    });
  </script>
</body>
</html>
